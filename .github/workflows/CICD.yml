name: API checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: api-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Full-repository lint has an existing backlog. Check changed files until
      # that separately scoped cleanup is complete; never auto-fix files in CI.
      - name: Lint changed TypeScript files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- 'src/**/*.ts' 'test/**/*.ts' |
            xargs -0 -r npx eslint

      - name: Unit tests
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build
